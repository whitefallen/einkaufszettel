<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Offline-first shopping list with encrypted sync">
  <meta name="theme-color" content="#1976D2">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  
  <!-- Luxury Typography: Playfair Display (serif) + Inter (sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@400&display=swap" rel="stylesheet">
  
  <title>Einkaufszettel</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <!-- Sidebar for list management - luxury minimal -->
  <div id="sidebar" class="sidebar hidden">
    <div class="sidebar-header">
      <h2>Lists</h2>
      <button id="close-sidebar" aria-label="Close sidebar">×</button>
    </div>
    <ul id="lists-container" role="list" aria-label="Shopping lists"></ul>
    <button id="new-list-button" class="new-list-btn">New List</button>
  </div>
  
  <div id="app">
    <header role="banner">
      <button id="menu-button" aria-label="Open menu" class="menu-btn">≡</button>
      <h1><span id="list-title">Shopping List</span></h1>
      <div id="sync-status" role="status" aria-live="polite"></div>
    </header>
    
    <main role="main">
      <div id="add-item-form" role="form">
        <input 
          type="text" 
          id="item-input" 
          placeholder="Add item..." 
          autocomplete="off"
          aria-label="Add new shopping item">
        <button 
          id="add-button" 
          aria-label="Add item"
          title="Add item">
        </button>
      </div>
      
      <ul id="shopping-list" role="list" aria-label="Shopping items"></ul>
    </main>
    
    <footer role="contentinfo">
      <button id="share-button" aria-label="Export list">Export list</button>
      <button id="clear-completed" aria-label="Clear completed items">Clear completed</button>
    </footer>
    
    <div id="share-modal" class="modal hidden" role="dialog" aria-labelledby="modal-title" aria-modal="true">
      <div class="modal-content">
        <h2 id="modal-title">Export List</h2>
        <p>Share this link:</p>
        <input type="text" id="share-link" readonly aria-label="Export link">
        <div id="share-pin" aria-label="Export code"></div>
        <button id="close-modal">Close</button>
      </div>
    </div>
  </div>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
