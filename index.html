<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Offline-first shopping list with encrypted sync">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Einkaufszettel</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Shopping List</h1>
      <div id="sync-status"></div>
    </header>
    
    <main>
      <div id="add-item-form">
        <input type="text" id="item-input" placeholder="Add item..." autocomplete="off">
        <button id="add-button">Add</button>
      </div>
      
      <ul id="shopping-list"></ul>
    </main>
    
    <footer>
      <button id="share-button">Share List</button>
      <button id="clear-completed">Clear Completed</button>
    </footer>
    
    <div id="share-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Share Shopping List</h2>
        <p>Share this link or PIN with others:</p>
        <input type="text" id="share-link" readonly>
        <div id="share-pin"></div>
        <button id="close-modal">Close</button>
      </div>
    </div>
  </div>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
